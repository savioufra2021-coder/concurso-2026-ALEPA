    <script>
      /* Apply saved theme preference before first paint to prevent light/dark flash on reload */
      (function() {
        try {
          var raw = localStorage.getItem('concurso_alepa_preferences_v1');
          var prefs = raw ? JSON.parse(raw) : null;
          var theme = prefs && prefs.theme ? prefs.theme : 'light';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = theme === 'dark' || (theme === 'auto' && prefersDark);
          var root = document.documentElement;
          root.classList.toggle('dark', isDark);
          root.style.colorScheme = isDark ? 'dark' : 'light';
          if (prefs && prefs.accentColor) root.dataset.accent = prefs.accentColor;
          if (prefs && prefs.fontScale) root.dataset.fontScale = prefs.fontScale;
          if (prefs && prefs.density) root.dataset.density = prefs.density;
        } catch (e) {}
      })();
      /* Suppress benign Vite dev HMR WebSocket disconnection errors inside iframe preview */
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('websocket') !== -1)) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && typeof e.reason.message === 'string' && (e.reason.message.indexOf('WebSocket') !== -1 || e.reason.message.indexOf('websocket') !== -1)) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
  </head>
